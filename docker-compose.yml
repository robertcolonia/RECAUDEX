services:
  db:
    image: postgres:18-alpine
    container_name: recaudex-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_DB: recaudex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - recaudex_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recaudex"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  recaudex_pgdata:
